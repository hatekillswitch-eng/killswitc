<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {background:transparent;margin:0;color:white;font-family:Arial}
.box {
 width:600px;height:300px;
 background:#100b19dd;
 border:3px solid #a855f7;
 border-radius:30px;
 box-shadow:0 0 25px #a855f7;
 text-align:center;padding:20px;
}
h2 {color:#c084fc;letter-spacing:4px}
button {
 background:#282033;color:white;border:2px solid #a855f7;
 border-radius:50%;width:55px;height:55px;margin:8px;
}
.active {background:#a855f7;box-shadow:0 0 20px #c084fc}
</style>
</head>
<body>
<div class="box">
<h2>Killswitch_443</h2>
<h3 id="status">Controller suchen...</h3>
<div id="buttons"></div>
</div>
<script>
const names=["×","○","□","△","L1","R1","L2","R2","Share","Options"];
const area=document.getElementById("buttons");
names.forEach((n,i)=>{
 let b=document.createElement("button");
 b.id="b"+i;b.textContent=n;area.appendChild(b);
});
function loop(){
 const pads=navigator.getGamepads();
 const p=[...pads].find(x=>x&&x.connected);
 document.getElementById("status").textContent=
 p?"CONTROLLER VERBUNDEN":"Controller suchen...";
 if(p) names.forEach((n,i)=>{
 document.getElementById("b"+i).classList.toggle(
 "active",p.buttons[i]?.pressed||false);
 });
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
